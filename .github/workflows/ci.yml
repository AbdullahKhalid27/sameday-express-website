name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # postinstall runs `prisma generate` already; explicit call kept as a
      # safety net in case the postinstall script changes.
      - name: Generate Prisma client
        run: npm run db:generate

      # `next build` runs full type-checking across the app. No DATABASE_URL
      # needed — src/lib/stripe.ts & co. stub themselves during build phase.
      - name: Build
        run: npm run build
