# GitHub Pages deployment — static export of the Next.js site.
# Vercel remains the canonical production host; this workflow provides
# a GitHub Pages mirror for repository previews only.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Generate Prisma client
        working-directory: web
        run: npx prisma generate

      # sitemap.ts, robots.ts, and manifest.ts are server-side route handlers
      # incompatible with `output: "export"`. We generate static equivalents
      # from the same data sources, then move the .ts files aside for the build.
      - name: Generate static sitemap.xml
        working-directory: web
        run: node scripts/generate-static-sitemap.cjs

      - name: Generate static robots.txt
        working-directory: web
        run: node scripts/generate-static-robots.cjs

      - name: Generate static manifest.webmanifest
        working-directory: web
        run: node scripts/generate-static-manifest.cjs

      - name: Move server-side route handlers aside
        working-directory: web
        run: |
          mv src/app/sitemap.ts src/app/sitemap.ts.bak
          mv src/app/robots.ts src/app/robots.ts.bak
          mv src/app/manifest.ts src/app/manifest.ts.bak

      - name: Build static export
        working-directory: web
        env:
          NEXT_OUTPUT_EXPORT: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

      # Restore the route handlers so they remain the source of truth in the
      # repo (Vercel build uses them). The checkout is fresh per run, so this
      # is belt-and-braces in case the job is re-run on the same workspace.
      - name: Restore route handlers
        if: always()
        working-directory: web
        run: |
          [ -f src/app/sitemap.ts.bak ] && mv src/app/sitemap.ts.bak src/app/sitemap.ts || true
          [ -f src/app/robots.ts.bak ] && mv src/app/robots.ts.bak src/app/robots.ts || true
          [ -f src/app/manifest.ts.bak ] && mv src/app/manifest.ts.bak src/app/manifest.ts || true

      - name: Add .nojekyll
        run: touch web/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
